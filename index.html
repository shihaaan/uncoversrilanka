<style>
/* Layout: one calm reading column (max 1080px), a green hero band, and a to-scale timeline as the signature element. */
:root {
  --bg: #F4F8F5;
  --surface: #FFFFFF;
  --ink: #12241F;
  --muted: #53655E;
  --line: #D6E0DA;
  --green: #0E5E4F;
  --green-soft: #E0EEE8;
  --on-green: #FFFFFF;
  --saffron: #E9A21B;
  --saffron-ink: #8F5A00;
  --on-saffron: #2A1B00;
  --maroon: #8A2433;
  --maroon-soft: #F5E4E7;
  --blue: #3E6C8F;
  --grey: #9AAAA3;
  --hero-bg: #0E5E4F;
  --hero-ink: #FFFFFF;
  --hero-muted: #CDE5DC;
  --leaf: #EFE6CC;
  --leaf-fibre: #E8DEC1;
  --leaf-ink: #3A2F1A;
  --leaf-line: #D6C79C;
  --cord: #8A6B3A;
  --hero-shade: rgba(7, 46, 39, 0.9);
  --hero-shade2: rgba(7, 46, 39, 0.55);
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A17; --surface: #15241F; --ink: #E8F0EC; --muted: #9DB0A8; --line: #2A3D36;
    --green: #5CC2A8; --green-soft: #17332C; --on-green: #0E1A17;
    --saffron: #F0AE3D; --saffron-ink: #F0AE3D; --on-saffron: #2A1B00;
    --maroon: #EC98A4; --maroon-soft: #3A1E23; --blue: #7FB0D6; --grey: #6F827A;
    --hero-bg: #123A31; --hero-ink: #EEF6F2; --hero-muted: #B5CFC6;
    --leaf: #2C2A1E; --leaf-fibre: #322F22; --leaf-ink: #EDE3C6; --leaf-line: #4A4530; --cord: #B0915A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A17; --surface: #15241F; --ink: #E8F0EC; --muted: #9DB0A8; --line: #2A3D36;
  --green: #5CC2A8; --green-soft: #17332C; --on-green: #0E1A17;
  --saffron: #F0AE3D; --saffron-ink: #F0AE3D; --on-saffron: #2A1B00;
  --maroon: #EC98A4; --maroon-soft: #3A1E23; --blue: #7FB0D6; --grey: #6F827A;
  --hero-bg: #123A31; --hero-ink: #EEF6F2; --hero-muted: #B5CFC6;
    --leaf: #2C2A1E; --leaf-fibre: #322F22; --leaf-ink: #EDE3C6; --leaf-line: #4A4530; --cord: #B0915A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--green); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--saffron-ink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; }
h1:focus { outline: none; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
li + li { margin-top: 0.35em; }

.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.prose { max-width: 66ch; }
.lead { font-size: 1.2rem; color: var(--muted); max-width: 60ch; }
.label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: 1.5rem; row-gap: 0.25rem; padding-block: 0.7rem; }
.brand { display: inline-flex; align-items: center; gap: 0.55rem; font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--ink); text-decoration: none; }
.brand .logo { height: 28px; width: auto; flex: none; }
.nav { display: flex; gap: 0.25rem; overflow-x: auto; max-width: 100%; min-width: 0; }
.nav a { white-space: nowrap; padding: 0.4rem 0.7rem; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 0.98rem; }
.nav a:hover { background: var(--green-soft); }
.nav a[aria-current="page"] { background: var(--green); color: var(--on-green); }

/* Hero */
.hero { background: linear-gradient(100deg, var(--hero-shade), var(--hero-shade2)), url("img/hero.jpg") center / cover no-repeat, var(--hero-bg); color: var(--hero-ink); }
.hero .credit { font-size: 0.78rem; color: var(--hero-muted); margin-top: 0.75rem; }
.hero .credit a { color: inherit; }
.hero .wrap { padding-block: clamp(2.5rem, 7vw, 4.5rem); display: flex; flex-direction: column; gap: 1.25rem; }
.hero h1 { font-size: clamp(2.3rem, 6.5vw, 4.25rem); max-width: 16ch; }
.hero p { color: var(--hero-muted); font-size: 1.2rem; max-width: 52ch; }
.hero .label { color: var(--hero-muted); }
.btns { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }
.btn { display: inline-block; padding: 0.7rem 1.2rem; border-radius: 999px; font-weight: 600; text-decoration: none; border: 2px solid transparent; }
.btn-main { background: var(--saffron); color: var(--on-saffron); }
.btn-ghost { border-color: var(--hero-muted); color: var(--hero-ink); }
.btn-green { background: var(--green); color: var(--on-green); }

/* Sections */
.section { padding-block: clamp(2rem, 5vw, 3.25rem); }
.section + .section { border-top: 1px solid var(--line); }
.section > .wrap { display: flex; flex-direction: column; gap: 1.25rem; }
.page-head { padding-block: clamp(1.75rem, 4vw, 2.75rem) 0.5rem; }
.page-head .wrap { display: flex; flex-direction: column; gap: 0.75rem; }
.back { font-size: 0.95rem; font-weight: 500; text-decoration: none; }
.back:hover { text-decoration: underline; }

/* Timeline (to scale) */
.tl { display: flex; flex-direction: column; gap: 0.35rem; }
.tl-cap { font-size: 0.8rem; color: var(--muted); }
.tl-row { position: relative; height: 30px; background: var(--line); border-radius: 4px; overflow: hidden; }
.tl-row.thin { height: 12px; }
.tl-seg { position: absolute; top: 0; bottom: 0; box-shadow: inset -1px 0 0 var(--bg); }
.tl-seg:hover { filter: brightness(1.12); }
.tl-ticks { position: relative; height: 1.6rem; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-ticks span { position: absolute; top: 0.3rem; white-space: nowrap; transform: translateX(-50%); }
.tl-ticks span.first { transform: none; }
.tl-ticks span.last { transform: translateX(-100%); }

/* Era list as palm-leaf manuscript strips threaded on a cord */
.leaves { list-style: none; margin: 0; padding: 10px 0; position: relative; display: flex; flex-direction: column; gap: 10px; }
.leaves::before, .leaves::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cord); }
.leaves::before { left: 10.25rem; }
.leaves::after { right: 2rem; }
.leaves li { margin: 0; position: relative; z-index: 1; }
.leaf { position: relative; display: grid; grid-template-columns: 8rem minmax(0, 1fr); column-gap: 2.5rem; align-items: center; padding: 1rem 4rem 1rem 1rem; color: var(--leaf-ink); text-decoration: none; border: 1px solid var(--leaf-line); border-radius: 14px; background-color: var(--leaf); background-image: repeating-linear-gradient(0deg, transparent 0, transparent 7px, var(--leaf-fibre) 7px, var(--leaf-fibre) 8px); }
.leaf:hover { border-color: var(--cord); }
.leaf::before, .leaf::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: radial-gradient(var(--cord) 0, var(--cord) 2px, var(--bg) 2.5px); box-shadow: 0 0 0 1px var(--leaf-line); }
.leaf::before { left: calc(10.25rem - 5px); }
.leaf::after { right: calc(2rem - 5px); }
.leaf .when { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.leaf .n { display: flex; align-items: center; gap: 0.45rem; font-family: var(--display); font-size: 1.6rem; font-weight: 700; line-height: 1; }
.leaf .n i { width: 10px; height: 10px; border-radius: 2px; }
.leaf .what { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.leaf .cap { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
.leaf .nm { font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.leaf .sm { font-size: 0.95rem; line-height: 1.45; }
@media (max-width: 640px) {
  .leaves::after, .leaf::after { display: none; }
  .leaves::before { left: 1.15rem; }
  .leaf::before { left: calc(1.15rem - 5px); }
  .leaf { grid-template-columns: minmax(0, 1fr); padding: 0.9rem 1rem 0.9rem 2.6rem; align-items: start; }
  .leaf .when { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 0.6rem; margin-bottom: 0.35rem; }
  .leaf .n { font-size: 1.2rem; }
}

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 1rem; }
.card { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--green); }
.card .ph { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--green-soft); color: var(--green); font-weight: 600; }
.card .bd { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; padding: 1rem 1.1rem 1.1rem; }
.shot { margin: 0; max-width: 100%; }
.shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--green-soft); }
.shot figcaption { margin-top: 0.4rem; font-size: 0.82rem; color: var(--muted); }
@media (max-width: 600px) { .shot img { aspect-ratio: 3 / 2; } }
.card p { color: var(--muted); font-size: 0.97rem; }
.card .meta { margin-top: auto; padding-top: 0.4rem; font-size: 0.85rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.55rem; border-radius: 999px; border: 1px solid transparent; }
.chip.heritage { background: var(--maroon-soft); color: var(--maroon); }
.chip.nature { background: var(--green-soft); color: var(--green); }
.chip.unesco { border-color: var(--line); color: var(--muted); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.filters button { font: inherit; font-size: 0.95rem; font-weight: 600; padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.filters button:hover { border-color: var(--green); }
.filters button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }

/* Facts */
.facts { display: grid; grid-template-columns: minmax(7rem, max-content) minmax(0, 1fr); gap: 0.5rem 1.25rem; margin: 0; padding: 1.1rem 1.25rem; background: var(--green-soft); border-radius: 10px; max-width: 66ch; }
.facts dt { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 0.2rem; }
.facts dd { margin: 0; }
@media (max-width: 480px) { .facts { grid-template-columns: 1fr; gap: 0.1rem; } .facts dd { margin-bottom: 0.6rem; } }

/* Tradition vs evidence */
.te { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1.25rem; padding-block: 1.1rem; border-block: 1px solid var(--line); max-width: 66ch; }
.te > div { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.te .label.t { color: var(--saffron-ink); }
.te .label.e { color: var(--green); }
.te p { font-size: 0.98rem; }

.links { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pill { padding: 0.35rem 0.85rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
.pill:hover { border-color: var(--green); }
.prevnext { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; padding-top: 0.5rem; }
.prevnext a { font-weight: 600; text-decoration: none; }
.prevnext a:hover { text-decoration: underline; }

.threads { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1.5rem 2rem; }
.threads a { display: flex; flex-direction: column; gap: 0.3rem; text-decoration: none; color: var(--ink); min-width: 0; }
.threads a p { color: var(--muted); font-size: 0.97rem; }
.threads a:hover h3 { color: var(--green); text-decoration: underline; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 0.98rem; }
th, td { text-align: left; padding: 0.6rem 0.75rem 0.6rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; white-space: nowrap; }

.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 0.75rem 2rem; margin: 0; }
.gloss div { min-width: 0; }
.gloss dt { font-weight: 700; display: inline; }
.gloss dd { margin: 0; display: inline; color: var(--muted); }

.cta { background: var(--green-soft); }
.cta .wrap { align-items: flex-start; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
footer .wrap { padding-block: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .card, .nav a, .filters button, .pill { transition: border-color 0.15s, background-color 0.15s; } }
</style>

<script>
const ERAS = [
  { id: "early", cap: "Before the kingdoms", name: "Early people and the chronicles", dates: "Prehistory to c. 377 BCE", start: -543, end: -377, color: "grey",
    summary: "People have lived on the island for tens of thousands of years. Its written story begins with chronicles kept by Buddhist monks.",
    facts: [["Dates", "Prehistory to c. 377 BCE"], ["Key sources", "The Dipavamsa and Mahavamsa chronicles; cave and settlement excavations"], ["Key figure", "Prince Vijaya, the legendary founder"]],
    sections: [
      ["The first islanders", ["Stone tools and human remains from caves such as Fa Hien and Batadombalena show that modern humans were living in Sri Lanka's rainforests more than 30,000 years ago. Archaeologists call these people Balangoda Man, after the town near early finds.", "The Vedda, the island's indigenous people, are widely regarded as descendants of these early hunter-gatherers. Small Vedda communities still live in the east and centre of the island."]],
      ["The chronicles", ["Much of what is known about the early kings comes from two chronicles written in Pali by Buddhist monks: the Dipavamsa, from around the 4th century CE, and the Mahavamsa, from around the 5th or 6th century CE. Few countries have a continuous written record this old.", "They were written centuries after the events they describe, and from a Buddhist and Sinhalese point of view. Historians value them and read them alongside archaeology, inscriptions and South Indian sources."]],
      ["From villages to a city", ["Excavations at Anuradhapura show an Iron Age settlement growing there from around 900 BCE, with farming, iron working, horses and cattle. By the time the chronicles name it a capital, people had lived on the site for centuries."]]
    ],
    note: { t: "The Mahavamsa says Prince Vijaya landed from northern India with 700 followers in 543 BCE, on the day the Buddha died, and founded the Sinhalese royal line.", e: "There is no archaeological proof of Vijaya himself. Language and settlement evidence does point to migration from northern India during the first millennium BCE, mixing with people already on the island." },
    places: ["anuradhapura", "wilpattu"] },
  { id: "anuradhapura", cap: "Capital: Anuradhapura", name: "Anuradhapura", dates: "c. 377 BCE to 1017 CE", start: -377, end: 1017, color: "green",
    summary: "For about 1,400 years one city was the centre of the island. It became one of the great capitals of the Buddhist world.",
    facts: [["Dates", "c. 377 BCE to 1017 CE"], ["Capital", "Anuradhapura"], ["Key figures", "Devanampiya Tissa, Dutugemunu, Mahasena, Kashyapa"], ["Known for", "Giant stupas, reservoirs and the arrival of Buddhism"]],
    sections: [
      ["A capital is founded", ["By tradition King Pandukabhaya made Anuradhapura his capital in 377 BCE. It stayed the seat of kings until the early 11th century, far longer than most capitals anywhere."]],
      ["Buddhism arrives", ["In the 3rd century BCE the monk Mahinda, sent from the court of the Indian emperor Ashoka, met King Devanampiya Tissa at Mihintale. The king adopted Buddhism, and it has shaped the island's art, law and daily life ever since.", "Soon after, the nun Sanghamitta brought a cutting from the tree under which the Buddha reached enlightenment. That tree, the Sri Maha Bodhi, still grows in Anuradhapura. It is one of the oldest living trees with a recorded planting."]],
      ["Builders on a huge scale", ["Kings marked their reigns with dagobas (stupas): solid brick domes that hold sacred relics. Dutugemunu, who ruled from 161 to 137 BCE, began the Ruwanwelisaya. The Jetavanaramaya, built under King Mahasena, stood about 122 metres tall. Apart from the great pyramids of Giza, almost nothing on earth was taller at the time."]],
      ["Mastering water", ["Anuradhapura lies in the dry zone, where most rain falls in one short season. Engineers answered with tanks: man-made reservoirs linked by canals with very gentle gradients. Thousands of tanks made rice farming possible, and many are still in use."]],
      ["The rock fortress and the fall", ["In the 5th century King Kashyapa seized the throne and built his palace on the rock of Sigiriya. Five centuries later, armies of the Chola empire of South India invaded. They sacked Anuradhapura in 993 and captured the last king in 1017."]]

      ["Parakramabahu the Great", ["Parakramabahu I ruled from 1153 to 1186. He united the island and rebuilt it. His greatest work is the Parakrama Samudra, the Sea of Parakrama, a reservoir so large it looks like an inland sea. He is remembered for the principle that no drop of rain should reach the ocean without first serving people."]],

    ],
    places: ["polonnaruwa", "minneriya", "dambulla"] },
  { id: "shifting", cap: "Capitals: Dambadeniya to Kotte", name: "The shifting kingdoms", dates: "1232 to 1597", start: 1232, end: 1597, color: "blue",

      ["A capital on the move", ["From 1232 Sinhalese kings ruled from a series of capitals, each further into the wetter south-west: Dambadeniya, Yapahuwa, Kurunegala, Gampola and finally Kotte, near modern Colombo. Historians link the move to invasion, the breakdown of the old irrigation system, disease and the pull of sea trade."]],

      ["An Indian Ocean crossroads", ["Cinnamon, gems, pearls and elephants drew merchants from Arabia, India and China. The Moroccan traveller Ibn Battuta visited in 1344 and climbed Sri Pada. In 1409 the Chinese admiral Zheng He left a stone tablet at Galle, carved in Chinese, Tamil and Persian. It is now in the National Museum in Colombo."]],
      ["Kotte and the first Europeans", ["Parakramabahu VI of Kotte, who came to the throne around 1412, was the last Sinhalese king to rule the whole island. In 1505 a Portuguese fleet arrived off the coast. In 1521 Kotte split between rival brothers, and the Portuguese used the divisions to take control of the lowlands."]]

  { id: "colonial", cap: "Colonial ports: Colombo and Galle", name: "The colonial era", dates: "1505 to 1948", start: 1505, end: 1948, color: "muted", row: 2,
    summary: "Three European powers ruled the coasts in turn. Each left forts, faiths, laws, crops and communities that are still part of the island.",
    facts: [["Portuguese", "1505 to 1658"], ["Dutch", "1658 to 1796"], ["British", "1796 to 1948"], ["Main exports", "Cinnamon, then coffee, then tea and rubber"]],
    sections: [
      ["The Portuguese", ["The Portuguese came for cinnamon and stayed for 150 years. They held the coastal lowlands, built the first forts and brought Roman Catholicism. Common Sri Lankan surnames such as Perera, Fernando and de Silva date from this time."]],
      ["The Dutch", ["In 1638 the king of Kandy allied with the Dutch East India Company to drive the Portuguese out. The Dutch then kept the coast for themselves. They ran the cinnamon trade as a strict monopoly, dug canals and built the ramparts of Galle. Roman-Dutch law remains part of Sri Lanka's legal system."]],
      ["The British", ["Britain took the Dutch territories in 1796 and made Ceylon a crown colony in 1802. After Kandy fell in 1815 it ruled the whole island, the first outside power ever to do so. English, railways and a plantation economy followed."]],
      ["Coffee, then tea", ["Hill forests were cleared for coffee. From 1869 a leaf disease destroyed the crop, and planters turned to tea. James Taylor had planted the first commercial tea estate at Loolecondera in 1867. To work the estates the British brought Tamil labourers from South India, whose descendants still live in the hill country."]],
      ["Towards self-rule", ["In 1931 Ceylon gained universal adult voting rights, among the first places in Asia to do so. Independence came peacefully on 4 February 1948.", "Burghers, people of mixed European and Sri Lankan descent, are a living legacy of all three colonial periods."]]
    ],
    places: ["galle-fort", "jaffna", "trincomalee", "nuwara-eliya", "ella", "south-coast"] },
  { id: "kandy", cap: "Capital: Kandy", name: "Kandy, the last kingdom", dates: "1597 to 1815", start: 1597, end: 1815, color: "maroon",
    summary: "While Europeans held the coast, a kingdom in the hills stayed independent for more than two centuries.",
    facts: [["Dates", "Sole independent kingdom from the 1590s to 1815"], ["Capital", "Kandy, also called Senkadagala"], ["Key figures", "Vimaladharmasuriya I, Rajasinghe II, Kirti Sri Rajasinha, Sri Vikrama Rajasinha"], ["Ended", "Kandyan Convention, 2 March 1815"]],
    sections: [
      ["A fortress of hills", ["Kandy sits in a bowl of steep, forested mountains. Portuguese, Dutch and British armies all marched in and were worn down by ambush, disease and monsoon rain. Kandyan forces defeated the Portuguese at Danture in 1594 and at Gannoruwa in 1638."]],
      ["The Tooth Relic", ["In the 1590s King Vimaladharmasuriya I brought the Buddha's Tooth Relic to Kandy. Whoever guarded the relic was seen as the rightful ruler, so the temple that houses it became the heart of the kingdom. It remains the most sacred Buddhist site in the country."]],
      ["Diplomacy and revival", ["Kandyan kings played the European powers against each other, allying with the Dutch against the Portuguese. From 1739 the throne passed to the Nayakkar line, a dynasty with South Indian roots. In 1753 King Kirti Sri Rajasinha invited monks from Siam (Thailand) to restore the Buddhist order. He also gave the Esala Perahera procession the form it has today."]],
      ["1815", ["The last king, Sri Vikrama Rajasinha, lost the support of his nobles. In 1815 they sided with the British, and the Kandyan Convention of 2 March handed the kingdom to the British crown. A rebellion in 1817 and 1818 was put down harshly. More than 2,000 years of island monarchy had ended."]]
    ],
    places: ["kandy", "sri-pada", "central-highlands"] },
  { id: "independence", cap: "Capital: Colombo", name: "Independence and the republic", dates: "1948 to 1983", start: 1948, end: 1983, color: "green",
    summary: "Ceylon became independent without a war. The decades that followed brought democracy, a new name and deepening divisions.",
    facts: [["Independence", "4 February 1948, as the Dominion of Ceylon"], ["Republic", "22 May 1972, renamed Sri Lanka"], ["Capital", "Colombo; parliament moved to Sri Jayawardenepura Kotte in 1982"], ["Key figures", "D.S. Senanayake, S.W.R.D. Bandaranaike, Sirimavo Bandaranaike, J.R. Jayewardene"]],
    sections: [
      ["A peaceful handover", ["On 4 February 1948 Ceylon became a self-governing dominion within the Commonwealth, with D.S. Senanayake as its first prime minister. The Independence Memorial Hall in Colombo marks the event."]],
      ["Language and citizenship", ["Early laws opened lasting wounds. The Ceylon Citizenship Act of 1948 left most hill-country Tamils of Indian origin without citizenship. In 1956 Sinhala was made the only official language, which shut many Tamil speakers out of government jobs. Protests and outbreaks of violence followed."]],
      ["Firsts and upheavals", ["In 1960 Sirimavo Bandaranaike became the world's first woman prime minister. In 1971 a youth uprising in the south was crushed. In 1972 the country became a republic and took the name Sri Lanka. A new constitution in 1978 created a powerful executive presidency."]],
      ["The road to war", ["Tamil political demands moved from equal rights towards a separate state, and armed groups formed in the north. The burning of the Jaffna Public Library in 1981 destroyed tens of thousands of books and manuscripts. In July 1983, after an ambush killed 13 soldiers, anti-Tamil riots swept the country. Many historians date the start of the civil war from that month."]]
    ],
    places: ["jaffna"] },
  { id: "conflict", cap: "Capital: Sri Jayawardenepura Kotte", name: "Conflict and recovery", dates: "1983 to 2009", start: 1983, end: 2009, color: "saffron",
    summary: "A 26-year civil war and a devastating tsunami marked these years. This page keeps to the main events and ends in 2009.",
    facts: [["Civil war", "July 1983 to May 2009"], ["Main parties", "The Government of Sri Lanka and the Liberation Tigers of Tamil Eelam (LTTE)"], ["Tsunami", "26 December 2004"], ["Lives lost in the war", "Estimated by the UN at 80,000 to 100,000"]],
    sections: [
      ["The war", ["The war was fought mainly in the north and east between the Sri Lankan state and the LTTE, which wanted an independent Tamil homeland. It included open battles, suicide bombings, assassinations and long periods of displacement for civilians."]],
      ["Attempts at peace", ["India sent a peacekeeping force from 1987 to 1990 under an accord with Sri Lanka. A ceasefire brokered by Norway in 2002 raised hopes and then broke down. In the same years a second uprising in the south, from 1987 to 1989, cost many more lives."]],
      ["Every community suffered", ["Tamil civilians endured shelling, displacement and disappearances. Sinhalese and Muslim civilians were killed in bombings and attacks on villages, and in 1990 the LTTE expelled Muslims from the north. An honest account has to hold all of these experiences together."]],
      ["The tsunami", ["On 26 December 2004 the Indian Ocean tsunami struck the east and south coasts. More than 30,000 people died in Sri Lanka and whole towns were swept away. Memorials stand along the coast road."]],
      ["2009 and after", ["The war ended in May 2009 with the military defeat of the LTTE. The final months caused heavy civilian casualties, and accountability for them is still debated in Sri Lanka and abroad. With peace, the north and east reopened to travellers and the long work of rebuilding began."]]

    places: ["jaffna", "trincomalee", "east-coast"] }

function timeline() {

function viewCulture() {

    <section class="section"><div class="wrap">
      <div class="stack prose"><h2>Peoples, faiths and languages</h2>
        <p>About three-quarters of Sri Lankans are Sinhalese. Sri Lankan Tamils, most numerous in the north and east, and Muslims, often called Moors, are each roughly a tenth of the population. Hill-country Tamils, Burghers, Malays and the indigenous Vedda complete the picture.</p>
        <p>Around seven in ten people are Buddhist. Hindus, Muslims and Christians make up the rest. The faiths overlap in daily life. Sri Pada is climbed by pilgrims of all four, and shrines to Hindu gods stand inside many Buddhist temples.</p>

      </div>
      <div class="stack"><h2>Festivals through the year</h2>
        <p class="prose">Many festivals follow the moon, so their dates shift from year to year. Every full moon, called a Poya day, is a public holiday.</p>
        <div class="scroll"><table>
          <thead><tr><th>When</th><th>Festival</th><th>What happens</th></tr></thead>
          <tbody>
            <tr><td>Mid-January</td><td>Thai Pongal</td><td>Tamil harvest festival. Families boil new rice with milk until it overflows, as a sign of plenty.</td></tr>

            <tr><td>Mid-April</td><td>Sinhala and Tamil New Year</td><td>The whole country stops for family visits, games, sweets and rituals timed to the minute.</td></tr>
            <tr><td>May full moon</td><td>Vesak</td><td>Marks the Buddha's birth, enlightenment and passing. Streets glow with lanterns, and free food stalls serve everyone.</td></tr>
            <tr><td>June full moon</td><td>Poson</td><td>Celebrates the arrival of Buddhism. Pilgrims gather at Mihintale and Anuradhapura.</td></tr>
            <tr><td>July or August</td><td>Kandy Esala Perahera</td><td>Ten nights of processions with drummers, dancers and elephants in honour of the Tooth Relic.</td></tr>
            <tr><td>August</td><td>Nallur Festival</td><td>Weeks of ceremonies and chariot processions at Jaffna's great Hindu temple.</td></tr>
            <tr><td>October or November</td><td>Deepavali</td><td>The Hindu festival of lights, with oil lamps, new clothes and sweets.</td></tr>

            <tr><td>25 December</td><td>Christmas</td><td>Celebrated by Christians and enjoyed widely, especially along the west coast.</td></tr>
          </tbody>
        </table></div>
      </div>
      <div class="stack prose"><h2>Food</h2>

          <li><strong>Hoppers.</strong> Bowl-shaped pancakes of fermented rice flour and coconut milk, crisp at the edge and soft in the middle. An egg hopper has an egg cooked into the base.</li>
          <li><strong>String hoppers.</strong> Small nests of steamed rice noodles, eaten with curry and coconut sambol.</li>
          <li><strong>Kottu.</strong> Flatbread chopped on a hot griddle with vegetables, egg and spices. You hear the blades before you see the stall.</li>
          <li><strong>Pol sambol.</strong> Fresh grated coconut pounded with chilli, onion and lime. It goes with almost everything.</li>

        <p>To drink there is Ceylon tea, grown in the hills since the 1860s, and the sweet water of the orange king coconut. True cinnamon is native to the island and was the spice that first drew European ships.</p>

            <tr><td>East coast</td><td>May to September</td><td>The north-east monsoon brings rain from about December to February.</td></tr>
            <tr><td>Cultural Triangle</td><td>Most of the year</td><td>It lies in the dry zone. The wettest months are usually October to January.</td></tr>
            <tr><td>Hill country</td><td>January to April</td><td>Clearer skies for views and walks. It can rain at any time, and nights are cool.</td></tr>
          </tbody>
        </table></div>
      </div>
      <div class="stack prose"><h2>Getting around</h2>
        <ul>
          <li><strong>Trains.</strong> Slow, cheap and scenic. The line from Kandy to Ella through the tea hills is a highlight in itself. Other lines run down the coast to Galle and north to Jaffna.</li>
          <li><strong>Car with a driver.</strong> The most common way for visitors to tour. It is flexible and saves time between sites.</li>
          <li><strong>Buses.</strong> They go everywhere and cost very little, but they are crowded and fast.</li>
          <li><strong>Tuk-tuks.</strong> Three-wheeled taxis for short trips. Agree the fare before you set off, or use a meter.</li>
        </ul>
        <p>The island is small but the roads are slow. A journey of 100 kilometres can take three hours or more, so plan fewer stops and longer stays.</p>
      </div>
      <div class="stack prose"><h2>Respect at sacred sites</h2>
        <ul>
          <li>Cover your shoulders and knees at temples, kovils, mosques and churches.</li>
          <li>Remove shoes and hats before entering. The ground can be hot, so carry socks.</li>
          <li>Never pose for a photo with your back to a Buddha statue, and do not touch or climb on statues.</li>
          <li>Images of the Buddha on clothing or as tattoos can cause real offence. Keep them covered.</li>
          <li>Do not touch monks. Women should hand items to a monk without contact.</li>
          <li>Ask before photographing people, especially at worship.</li>
        </ul>
      </div>
      <div class="stack prose"><h2>A first route</h2>
        <p>This loop follows the story roughly in order and takes about two weeks at a relaxed pace.</p>
        <ol>
          <li><a href="#place-anuradhapura">Anuradhapura</a> and <a href="#place-mihintale">Mihintale</a>, where the story begins.</li>
          <li><a href="#place-sigiriya">Sigiriya</a>, <a href="#place-dambulla">Dambulla</a> and <a href="#place-polonnaruwa">Polonnaruwa</a>, with an afternoon at <a href="#place-minneriya">Minneriya</a>.</li>
          <li><a href="#place-kandy">Kandy</a>, the last kingdom.</li>
          <li>By train into the hills: <a href="#place-nuwara-eliya">Nuwara Eliya</a>, <a href="#place-central-highlands">Horton Plains</a> and <a href="#place-ella">Ella</a>.</li>
          <li>Down to the coast for <a href="#place-galle-fort">Galle Fort</a> and the <a href="#place-south-coast">southern beaches</a>, or east to <a href="#place-east-coast">the east coast</a> if the season suits.</li>
        </ol>
      </div>
      <div class="stack prose"><h2>Official information</h2>
        <p>Rules and prices change. Check these before you book.</p>
        <ul>
          <li><a href="https://www.srilanka.travel" target="_blank" rel="noopener">Sri Lanka Tourism</a>, the official tourism site</li>
          <li><a href="https://www.eta.gov.lk" target="_blank" rel="noopener">Electronic Travel Authorization</a>, the government visa portal</li>
          <li><a href="https://whc.unesco.org/en/statesparties/lk" target="_blank" rel="noopener">UNESCO World Heritage Centre</a>, for the island's listed sites</li>
        </ul>
      </div>
    </div></section>`;
}

function viewAbout() {
  return `<div class="page-head"><div class="wrap">
      <h1 tabindex="-1">About</h1>
      <p class="lead">Uncover Sri Lanka is an independent, non-commercial guide to the island's history and places, created by <a href="https://www.linkedin.com/in/shihansabir/" target="_blank" rel="noopener">Shihan</a>.</p>
    </div></div>
    <section class="section"><div class="wrap">
      <div class="stack prose"><h2>Why this site exists</h2>
        <p>Sri Lanka's story is one of the longest and richest in Asia, yet it is little known outside the island. This site was made to change that, and as a way of giving something back to the country.</p>
        <p>If it leaves you curious enough to visit, even better. Travel done with understanding and respect is good for the people who live there.</p>
      </div>
      <div class="stack prose"><h2>Version 1</h2>
        <p>This is the first version of Uncover Sri Lanka. It covers eight eras of history and 21 places. More detail is planned for later versions.</p>
      </div>
      <div class="stack prose"><h2>How it is written</h2>
        <ul>
          <li><strong>Built to last.</strong> The site covers history and places, which change slowly. Prices, opening hours and visa rules are left to official sources.</li>
          <li><strong>Legend and evidence kept apart.</strong> Where the chronicles and archaeology differ, the page says so.</li>
          <li><strong>The whole island.</strong> Sinhalese, Tamil, Muslim, Burgher, Malay and Vedda histories all belong to the story.</li>
          <li><strong>Nothing for sale.</strong> No hotels, tours or businesses are promoted here.</li>
        </ul>
      </div>
      <div class="stack prose"><h2>Sources</h2>
        <p>The history on this site draws on the following references.</p>
        <ul>
          <li><a href="https://www.britannica.com/place/Sri-Lanka/History" target="_blank" rel="noopener">Encyclopaedia Britannica</a>, History of Sri Lanka</li>
          <li><a href="https://whc.unesco.org/en/statesparties/lk" target="_blank" rel="noopener">UNESCO World Heritage Centre</a>, site descriptions for Sri Lanka</li>
          <li><a href="https://www.ccf.gov.lk" target="_blank" rel="noopener">Central Cultural Fund</a>, Government of Sri Lanka</li>
          <li>K.M. de Silva, <em>A History of Sri Lanka</em></li>
          <li>Nira Wickramasinghe, <em>Sri Lanka in the Modern Age: A History</em></li>
          <li>The <em>Mahavamsa</em> and <em>Dipavamsa</em> chronicles, read as traditional accounts</li>
        </ul>
        <p>Version 1. Last reviewed in 2026.</p>
      </div>
      <div class="stack prose"><h2>Photo credits</h2>
        <p>Photographs are used under the <a href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash</a> and <a href="https://www.pexels.com/license/" target="_blank" rel="noopener">Pexels</a> licences, with thanks to the photographers.</p>
        <ul>${Object.keys(PHOTOS).map(id => `<li>${id === "hero" ? "Home page" : place(id).name}: ${PHOTOS[id][5] === "pexels" ? PHOTOS[id][0] + " (Pexels)" : `<a href="${U}${PHOTOS[id][1]}" target="_blank" rel="noopener">${PHOTOS[id][0]}</a>`}</li>`).join("")}</ul>
      </div>
    </div></section>`;
}

const app = document.getElementById("app");
let first = true;
function route() {
  const h = location.hash.slice(1) || "home";
  let html, key = h;
  if (h.startsWith("era-") && era(h.slice(4))) { html = viewEra(era(h.slice(4))); key = "story"; }
  else if (h.startsWith("place-") && place(h.slice(6))) { html = viewPlace(place(h.slice(6))); key = "places"; }
  else if (h === "story") html = viewStory();
  else if (h === "places") html = viewPlaces();
  else if (h === "culture") html = viewCulture();
  else if (h === "visiting") html = viewVisiting();
  else if (h === "about") html = viewAbout();
  else { html = viewHome(); key = "home"; }
  app.innerHTML = html;
  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.k === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (!first) {
    window.scrollTo(0, 0);
    const h1 = app.querySelector("h1");
    if (h1) h1.focus({ preventScroll: true });
  }
  first = false;
}
app.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-f]");
  if (!b) return;
  placeFilter = b.dataset.f;
  document.getElementById("place-grid").innerHTML = placeGrid();
  app.querySelectorAll("button[data-f]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.f === placeFilter)));
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
